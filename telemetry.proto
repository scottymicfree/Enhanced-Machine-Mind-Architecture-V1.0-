syntax = "proto3";

package telemetry;

message StreamRequest {}

message HardwareMetrics {
  float cpu_usage = 1;
  float ram_usage = 2;
  float tpu_usage = 3;
  float temperature = 4;
}

message ThreatAlert {
  string id = 1;
  string severity = 2;
  string vector = 3;
  string target = 4;
  string timestamp = 5;
}

message MemoryVector {
  string id = 1;
  float x = 2;
  float y = 3;
  float z = 4;
  bool is_decay_active = 5;
  string semantic_label = 6;
}

message DashboardResponse {
  HardwareMetrics hardware = 1;
  repeated ThreatAlert threats = 2;
  repeated MemoryVector spatial_vectors = 3;
  string neuro_phase = 4;
}

service Dashboard {
  rpc StreamTelemetry(StreamRequest) returns (stream DashboardResponse) {}
}
