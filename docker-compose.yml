version: '3.8'

services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.23.9
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_LIMIT_DEFAULT: 100
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
    restart: always

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    restart: always

  envoy:
    image: envoyproxy/envoy:v1.28-latest
    ports:
      - "8000:8000" # Exposes compiled gRPC-Web proxy client bindings directly to browser fallbacks
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    restart: always

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always

  ray-head:
    image: rayproject/ray:2.9.0-py310
    ports:
      - "6379:6379" # Ray interior port
      - "8265:8265" # Ray Dashboard
      - "10001:10001" # Ray Client
    command: ray start --head --port=6379 --dashboard-host=0.0.0.0 --disable-usage-stats
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /dev/shm:/dev/shm # Mandatory to prevent Ray OOM issues on nested virtualization targets
    restart: always

volumes:
  weaviate_data:
  redis_data:
  ollama_storage:
