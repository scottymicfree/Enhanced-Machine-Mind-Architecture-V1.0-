[package]
name = "emma-dashboard"
version = "1.0.0"
description = "E.M.M.A. Sovereign Desktop Command Panel"
authors = ["Sovereign Architect"]
edition = "2021"

[build-dependencies]
tonic-build = "0.10"

[dependencies]
tauri = { version = "1.5", features = ["shell-all", "api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32", features = ["full"] }
tonic = "0.10"
prost = "0.12"
dotenvy = "0.15"
async-stream = "0.3"
sysinfo = "0.29"
nvml-wrapper = "0.9"
rand = "0.8"
sha2 = "0.10"
base64 = "0.21"
reqwest = { version = "0.11", features = ["json"] }
open = "4.0"
keyring = "2.0"

[features]
# Keep features minimal for native cross-compilation target boundaries
custom-protocol = ["tauri/custom-protocol"]
